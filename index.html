
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Practice</title>
</head>
<body>

    <h1>My Counter</h1>

    <h2 id="count">0</h2>

    <button onclick="decrement()">-</button>
    <button onclick="reset()">Reset</button>
    <button onclick="increment()">+</button>

    <script>
        let count = 0;

        function increment() {
            count++;
            document.getElementById("count").textContent = count;
        }

        function decrement() {
            count--;
            document.getElementById("count").textContent = count;
        }

        function reset() {
            count = 0;
            document.getElementById("count").textContent = count;
        }
    </script>

</body>
</html>
